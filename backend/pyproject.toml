[project]
name = "jarvis"
version = "0.1.0"
description = "JARVIS - personal AI operating system (backend)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "psutil>=6", "httpx>=0.27", "anthropic>=1.0", "numpy>=2",
  "pypdf>=5", "python-docx>=1.1", "croniter>=3", "jsonschema>=4", "beautifulsoup4>=4.12", "python-multipart>=0.0.9", "keyring>=25",
]
[project.optional-dependencies]
dev = ["pytest>=8", "reportlab>=4"]
desktop = ["mss>=9", "rapidocr-onnxruntime>=1.2", "pynput>=1.7", "pillow>=10", "playwright>=1.45", "pystray>=0.19", "ctranslate2>=4.5", "sentencepiece>=0.2"]
[project.scripts]
jarvis = "jarvis.__main__:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["jarvis*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
